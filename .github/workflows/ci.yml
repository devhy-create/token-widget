name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 数据引擎（纯 Rust，不依赖窗口 / WebView，三个系统都能跑）
  rust-core:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri
      - run: cargo test -p agent_core
        working-directory: tauri
