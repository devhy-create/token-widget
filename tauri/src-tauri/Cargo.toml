[package]
name = "agent-monitor"
description = "悬浮小组件：实时显示 Claude / Codex / Antigravity / WorkBuddy 的 token 速度、额度与用量"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dependencies]
agent_core = { path = "../core" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# 只用 png 编解码，把过大的应用图标缩到 128px
image = { version = "0.25", default-features = false, features = ["png"] }
